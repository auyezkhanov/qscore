server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Client IP: honour X-Forwarded-For only when it comes from a proxy on a private
  # network (e.g. a TLS terminator on the host); public clients can't spoof it.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml text/calendar;
  gzip_min_length 1024;

  # Same-origin API: the SPA calls /api, nginx forwards to the backend container.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # $remote_addr is the resolved client IP (see real_ip above); one hop, nothing to spoof.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Hashed build assets never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The service worker must be revalidated so updates reach installed clients.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Client-side routes fall back to the SPA shell (never cached, so deploys show up).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
